[package]
name = "linscp-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
filetime.workspace = true
linscp-types = { path = "../linscp-types" }
notify.workspace = true
rand.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

# The SAF bridge is compiled everywhere so a desktop host can test the
# `content://` paths against a mock bridge; its file operations are POSIX.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # `Win32_Security` (SDDL parsing, DACL reads) and
    # `Win32_Security_Authorization` (`SetNamedSecurityInfoW`) exist so
    # `ensure_private_dir` can lock the configuration directory to its owner;
    # without them the ACL calls below do not compile.
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[lints]
workspace = true
