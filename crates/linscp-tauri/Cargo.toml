[package]
name = "linscp-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = []
native-shell = ["dep:tauri", "dep:tauri-build", "tauri/custom-protocol"]

[[bin]]
name = "linscp-gui"
path = "src/main.rs"
required-features = ["native-shell"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
linscp-platform.workspace = true
linscp-service.workspace = true
linscp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.1", optional = true , features = [] }
zeroize.workspace = true

[lints]
workspace = true
