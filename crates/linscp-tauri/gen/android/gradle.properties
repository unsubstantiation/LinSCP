# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Configuration cache is off: the Kotlin Gradle plugin (1.9.24) registers an
# unsupported task-completion listener, which fails the build when the cache
# entry is stored. Re-enable after upgrading the Kotlin plugin.
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
