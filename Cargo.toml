[workspace]
resolver = "2"
members = [
    "crates/linscp-types",
    "crates/linscp-i18n",
    "crates/linscp-crypto",
    "crates/linscp-platform",
    "crates/linscp-proto",
    "crates/linscp-engine",
    "crates/linscp-service",
    "crates/linscp-http",
    "crates/linscp-cli",
    "crates/linscp-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license-file = "../../LICENSE"
publish = false

[workspace.dependencies]
linscp-types = { path = "crates/linscp-types" }
linscp-i18n = { path = "crates/linscp-i18n" }
linscp-crypto = { path = "crates/linscp-crypto" }
linscp-platform = { path = "crates/linscp-platform" }
linscp-proto = { path = "crates/linscp-proto" }
linscp-engine = { path = "crates/linscp-engine" }
linscp-service = { path = "crates/linscp-service" }
linscp-http = { path = "crates/linscp-http" }

async-trait = "0.1"
aes = "0.8"
argon2 = "0.5"
axum = { version = "0.7", features = ["json", "ws"] }
base64 = "0.22"
bcrypt-pbkdf = "0.10"
bytes = "1.7"
crc32fast = "1.4"
ed25519-dalek = "2.1"
encoding_rs = "0.8"
filetime = "0.2"
futures-core = "0.3"
hmac = "0.12"
http = "1.1"
md-5 = "0.10"
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }
num-bigint = "0.4"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "stream", "socks"] }
roxmltree = "0.20"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
rustls-pki-types = { version = "1.9", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "io-std", "time", "fs", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
