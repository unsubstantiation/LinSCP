name: Temporary container service validation
on:
  push:
    branches: [arena/5673708c-linscp]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p linscp-service container_service_dispatch
      - run: cargo test -p linscp-service vault
      - run: cargo test -p linscp-engine backup
