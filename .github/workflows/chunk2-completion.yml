name: Transfer resume completion checks
on:
  push:
    branches: [arena/4b00efe6-linscp]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resume and protocol integration checks
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-engine --test ordinary_conditional_resume --test ftp_staged_ascii --test sftp_live_cases --test script_engine_cases -- --nocapture
      - name: Service regression checks
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service --lib -- --test-threads=1 --skip live_
