name: Arena Debian package validation
on:
  push:
    branches: [arena/c4f5bb7a-linscp]
permissions:
  contents: read
jobs:
  debian-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-deb-release
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential dpkg-dev debhelper pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool xauth openbox
      - name: Build and install Debian package
        run: |
          set -euo pipefail
          dpkg-buildpackage -b -us -uc -d -j$(nproc)
          shopt -s nullglob
          debs=(../linscp_*_*.deb)
          test "${#debs[@]}" -eq 1
          dpkg-deb --contents "${debs[0]}"
          contents=$(dpkg-deb --contents "${debs[0]}" | awk '{print $NF}' | sed 's|^\./||')
          for path in usr/bin/linscp-gui usr/share/applications/linscp.desktop usr/share/pixmaps/linscp.png usr/share/icons/hicolor/scalable/apps/linscp.svg; do
            echo "$contents" | grep -qx "$path"
          done
          if echo "$contents" | grep -qx usr/bin/linscp; then exit 1; fi
          sudo dpkg -i "${debs[0]}"
          test -x /usr/bin/linscp-gui
      - name: Launch staged GUI under Xvfb
        run: |
          set -euo pipefail
          test -x /usr/bin/linscp-gui
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          if xvfb-run -a bash -euo pipefail -c '
            openbox >/dev/null 2>&1 & wm=$!
            linscp-gui >/tmp/linscp-deb-smoke.log 2>&1 & app=$!
            trap "kill $app $wm 2>/dev/null || true" EXIT
            for i in $(seq 1 120); do
              if ! kill -0 "$app" 2>/dev/null; then cat /tmp/linscp-deb-smoke.log; exit 1; fi
              if xdotool search --onlyvisible --name "^LinSCP" >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            cat /tmp/linscp-deb-smoke.log
            exit 1
          ' > /tmp/deb-smoke-run.log 2>&1; then
            cat /tmp/deb-smoke-run.log
          else
            python3 -c "import pathlib; s=pathlib.Path('/tmp/deb-smoke-run.log').read_text(); print('::error::' + s[-12000:].replace('%','%25').replace('\n','%0A').replace('\r','%0D'))"
            exit 1
          fi
