name: Session URL validation
on:
  push:
    branches: [arena/cf506e43-linscp]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - name: Test URL parsing and security
        shell: bash
        env:
          RUST_MIN_STACK: '16777216'
        run: |
          for entry in 'linscp-engine invalid_session_urls_never_echo_input_or_credentials' 'linscp-engine url_parser_enforces_schemes_ipv6_brackets_and_percent_encoding' 'linscp-service pasted_url_errors_do_not_expose_credentials' 'linscp-platform startup_session_url_is_not_a_registered_action'; do
            read -r package test <<< "$entry"
            cargo test -p "$package" "$test" > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
          done
