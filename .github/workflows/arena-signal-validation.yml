name: POSIX signal validation
on:
  push:
    branches: [arena/cf506e43-linscp]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test isolated signal handling
        shell: bash
        run: |
          cargo test -p linscp-platform --test signal_handling > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
