name: Temporary TLS validation
on:
  push:
    branches: [arena/5673708c-linscp]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p linscp-engine tls_material_is_committed_atomically_with_session
      - run: cargo test -p linscp-engine container_script_savesession
      - run: cargo test -p linscp-service container_
