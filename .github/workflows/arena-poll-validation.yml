name: Polling fallback validation
on:
  push:
    branches: [arena/cf506e43-linscp]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - name: Polling and watcher tests
        shell: bash
        env:
          RUST_MIN_STACK: '16777216'
        run: |
          cargo test -p linscp-engine --lib failed_native_watch_falls_back_to_polling_changes > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
          cargo test -p linscp-service saf_keep_up_to_date_ -- --test-threads=1 > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
          cargo test -p linscp-engine --test sftp_live_cases test_keepuptodate_wakes_on_a_local_change > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
          cargo test -p linscp-platform dir_watcher_observes_newly_written_file > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
