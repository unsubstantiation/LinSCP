name: WebDAV conditional response validation
on:
  push:
    branches: [arena/cf506e43-linscp]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - name: Protocol and engine
        shell: bash
        run: |
          cargo test -p linscp-engine --test ordinary_conditional_resume > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
          cargo test -p linscp-proto --test webdav_and_s3 > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
      - name: Service WebDAV fixture
        if: runner.os == 'Linux'
        shell: bash
        env:
          LSCP_LIVE_WEBDAV: '1'
          RUST_MIN_STACK: '16777216'
        run: |
          cargo test -p linscp-service live_webdav_gui_upload_download > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
