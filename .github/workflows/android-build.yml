name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build and test the UI
        run: |
          npm ci --prefix ui --no-audit --no-fund
          python3 tools/run_cargo_ci.py npm --prefix ui test
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -n 1)" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"
      - name: Generate Tauri Android project
        working-directory: crates/linscp-tauri
        run: ../../ui/node_modules/.bin/tauri android init --ci --skip-targets-install
      - name: Build real Rust-backed APK
        working-directory: crates/linscp-tauri
        run: ../../ui/node_modules/.bin/tauri android build --ci --debug --apk --target aarch64 x86_64 --features native-shell
      - name: Verify APK contents and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find crates/linscp-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          unzip -l "$apk" | grep 'lib/arm64-v8a/liblinscp_tauri.so'
          unzip -l "$apk" | grep 'lib/x86_64/liblinscp_tauri.so'
          unzip -l "$apk" | grep 'assets/.*index.html'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          mkdir -p android-artifacts
          cp "$apk" android-artifacts/linscp-android-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: linscp-android-debug
          path: android-artifacts/linscp-android-debug.apk
          if-no-files-found: error
