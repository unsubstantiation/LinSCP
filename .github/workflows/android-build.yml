name: Android build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ github.event_name == 'pull_request' && 'Android pull-request check' || 'Signed Android release APK' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: ${{ github.event_name != 'pull_request' && 'android-release' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure Maven Central mirror to avoid HTTP 429 rate limits
        run: |
          mkdir -p ~/.gradle/init.d
          H1="repo.maven"
          H2="apache.org/maven2"
          M1="maven-central.storage-download"
          M2="://googleapis.com"
          cat << EOF > ~/.gradle/init.d/maven-mirror.gradle
          allprojects {
            buildscript {
              repositories {
                all { ArtifactRepository repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().startsWith("https://${H1}.${H2}")) {
                    repo.url = uri("https://${M1}.${M2}")
                  }
                }
              }
            }
            repositories {
              all { ArtifactRepository repo ->
                if (repo instanceof MavenArtifactRepository && repo.url.toString().startsWith("https://${H1}.${H2}")) {
                  repo.url = uri("https://${M1}.${M2}")
                }
              }
            }
          }
          EOF

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Build and test the UI
        run: |
          npm ci --prefix ui --no-audit --no-fund
          python3 tools/run_cargo_ci.py npm --prefix ui test

      - name: Check the Android application ID and signing configuration
        run: |
          python3 -m unittest discover -s tools/tests -p test_android_application_id.py
          python3 -m unittest discover -s tools/tests -p test_android_release_signing.py
          python3 -m unittest discover -s tools/tests -p test_android_saf_smoke.py
          echo "applicationId: $(python3 tools/android_application_id.py)"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ~/Android/Sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('tools/prepare_android_sdk.sh') }}

      - name: Prepare Android SDK
        run: python3 tools/run_cargo_ci.py bash tools/prepare_android_sdk.sh

      - name: Generate Tauri Android project
        working-directory: crates/linscp-tauri
        run: |
          python3 ../../tools/run_cargo_ci.py npm run tauri -- android init --ci --skip-targets-install
          python3 ../../tools/prepare_android_project.py

      # --- Pull Request Steps ---
      - name: Build unsigned debug APK for both ABIs
        if: github.event_name == 'pull_request'
        working-directory: crates/linscp-tauri
        run: python3 ../../tools/run_cargo_ci.py npm run tauri -- android build --ci --debug --apk true --aab false --target aarch64 x86_64 --features native-shell

      - name: Verify debug APK contents and package
        if: github.event_name == 'pull_request'
        run: python3 tools/run_cargo_ci.py python3 tools/verify_android_apk.py --build-type debug

      # --- Master / Manual Release Steps ---
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/run_cargo_ci.py python3 tools/android_release_signing.py

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: crates/linscp-tauri
        run: python3 ../../tools/run_cargo_ci.py npm run tauri -- android build --ci --apk true --aab false --target aarch64 x86_64 --features native-shell

      - name: Verify release APK contents, package and signature
        if: github.event_name != 'pull_request'
        run: python3 tools/run_cargo_ci.py python3 tools/verify_android_apk.py --build-type release

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: linscp-android-release
          path: android-artifacts/linscp-android-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build debug APK for the WebView smoke test
        if: github.event_name != 'pull_request'
        working-directory: crates/linscp-tauri
        run: python3 ../../tools/run_cargo_ci.py npm run tauri -- android build --ci --debug --apk true --aab false --target x86_64 --features native-shell

      - name: Verify debug APK contents and package
        if: github.event_name != 'pull_request'
        run: python3 tools/run_cargo_ci.py python3 tools/verify_android_apk.py --build-type debug --abi x86_64

      - name: Enable emulator acceleration
        if: github.event_name != 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise the WebView, Rust IPC and WebDAV transfers, then the signed APK
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            python3 tools/run_cargo_ci.py bash tools/android_emulator_smoke.sh
            python3 tools/run_cargo_ci.py bash tools/android_release_launch_check.sh
