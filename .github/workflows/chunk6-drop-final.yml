name: Chunk 6 final drop checks
on:
  push:
    branches: [arena/4b00efe6-linscp]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/run_cargo_ci.py cargo test -p linscp-service drop_staging_bounds_search_filters_custom_prompts_and_bookmark_reorder -- --nocapture
      - run: python3 tools/run_cargo_ci.py cargo test -p linscp-service a_native_window_drop_names_paths_and_the_backend_reads_them -- --nocapture
      - run: python3 tools/run_cargo_ci.py cargo test -p linscp-service shell_manifest_has_at_most_one_successful_consumer -- --nocapture
