name: Temporary remote delete validation
on:
  push:
    branches: [arena/7d43ba52-linscp]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: delete-validation
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libkrb5-dev libssl-dev
      - name: Run remote delete test
        shell: bash
        run: |
          set +e
          export CARGO_TERM_COLOR=never
          cargo test -p linscp-service --lib remote_delete_reports_partial_failures_and_rejects_unsafe_listing_names -- --nocapture > test-output.txt 2>&1
          status=$?
          tail -50 test-output.txt
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path('test-output.txt').read_text(errors='replace').splitlines()[-50:])[-3500:]
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$status"
