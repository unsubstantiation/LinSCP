name: Debian build

on:
  push:
    branches: [master]
  # Run by hand from the Actions tab (or `gh workflow run`) to build a branch
  # or re-run a build without waiting for a push to master.
  workflow_dispatch:

jobs:
  build:
    name: Debian package (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the Rust toolchain and packaging dependencies
        run: |
          sudo apt-get update -qq
          # The workspace needs Rust 1.89+, newer than the rustc the runner
          # image ships, so the real toolchain comes from rustup. The apt
          # cargo/rustc packages only satisfy dpkg's Build-Depends check;
          # $HOME/.cargo/bin is prepended to PATH so rustup's cargo runs
          # the build in debian/rules.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential dpkg-dev pkg-config curl cargo rustc nodejs npm \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool xauth openbox x11-utils python3-paramiko python3-pyftpdlib python3-openssl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Check GUI distribution configuration
        run: python3 -m unittest discover -s tools/tests -p test_gui_distribution.py

      # Every workflow in this directory is also startable by hand; a build that
      # only runs on a push to master cannot be tried on the branch that
      # changes it. The test reads the `on:` mappings so a trigger cannot be
      # dropped without failing here.
      - name: Check that every workflow can be started by hand
        run: python3 -m unittest discover -s tools/tests -p test_workflow_triggers.py

      # The same page is served by two hosts. The frontend suite builds
      # `ui/dist` and drives it in jsdom, the translation compiler rejects an
      # uncatalogued message, and the shared-frontend check keeps a page
      # endpoint that no route serves from shipping. None of them needs the
      # Tauri build, so they run before it.
      - name: Install the frontend dependencies
        run: npm --prefix ui ci --no-audit --no-fund

      - name: Test the shared frontend
        run: npm --prefix ui test

      - name: Check the translation catalogs are compiled and current
        run: python3 tools/compile_translations.py --check && python3 tools/check_shared_frontend.py

      # B-suite triage: the parity ledger is only as honest as its checker, and
      # the checker only guards what CI runs. This validates the ledger itself
      # (the inventory plus the checker's own regressions) and the repo-state
      # suites the ledger cites as Linux evidence. All are pure-Python checks
      # of repo state, so one job running them is enough.
      - name: Check the parity ledger and its repo-state suites
        run: |
          python3 tools/check_upstream_parity.py
          python3 -m unittest discover -s tools/tests -p test_parity_inventory.py
          python3 -m unittest discover -s tools/tests -p test_platform_conversion.py
          python3 -m unittest discover -s tools/tests -p test_wayland_compatibility.py
          python3 -m unittest discover -s tools/tests -p test_translations.py
          python3 -m unittest discover -s tools/tests -p test_repo_hygiene.py

      # A crate that nothing in the packaging path builds can be broken for
      # weeks while every targeted test passes. Compiling and testing the
      # browser host crate in one go is what keeps that from happening: the
      # axum handler signatures the browser mode depends on are checked here,
      # not only when a smoke test happens to reach them.
      - name: Compile and test the browser host crate
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-http

      - name: Exercise atomic local moves
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service local_moves_are_atomic_no_replace -- --nocapture

      - name: Exercise workspace persistence and unavailable-action handling
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service workspace_round_trip_and_unavailable_actions_fail_closed -- --nocapture

      - name: Exercise owned local download cleanup
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-engine owned_stage_cleanup_tests -- --nocapture

      - name: Exercise native SFTP host-key verification and transfers
        env:
          LSCP_LIVE_SFTP: "1"
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service live_sftp_connection_hostkey_upload_download -- --nocapture

      - name: Exercise native WebDAV connection and transfers
        env:
          LSCP_LIVE_WEBDAV: "1"
          # The dispatch future has grown with every endpoint added to it; a
          # debug build of this case needs more than the 2 MiB test-thread floor.
          RUST_MIN_STACK: "16777216"
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service live_webdav_ -- --nocapture --test-threads=1

      - name: Exercise native FTP connection and download
        env:
          LSCP_LIVE_FTP: "1"
          RUST_MIN_STACK: "16777216"
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service live_ftp_ -- --nocapture --test-threads=1

      - name: Exercise native explicit FTPS connection and download
        env:
          LSCP_LIVE_FTPES: "1"
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service live_ftpes_gui_download -- --nocapture

      - name: Exercise implicit FTPS upload
        env:
          LSCP_LIVE_FTPS_IMPLICIT: "1"
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service live_ftps_implicit_gui_upload -- --nocapture

      - name: Exercise S3 cleanup journal selection
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-proto cleanup_sampling_tests -- --nocapture

      - name: Exercise native S3 TLS connection and download
        env:
          LSCP_LIVE_S3: "1"
          RUST_MIN_STACK: "16777216"
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service live_s3_ -- --nocapture --test-threads=1

      - name: Build the binary package
        run: python3 tools/run_cargo_ci.py dpkg-buildpackage -b -us -uc

      - name: Check the package contents
        run: |
          deb=$(ls ../linscp_*_*.deb)
          echo "Built $deb"
          dpkg-deb --contents "$deb"
          contents=$(dpkg-deb --contents "$deb" | awk '{print $NF}' | sed 's|^\./||' | sort)
          for path in usr/bin/linscp-gui \
                      usr/bin/linscp-web \
                      usr/share/applications/linscp.desktop \
                      usr/share/applications/linscp-web.desktop \
                      usr/share/pixmaps/linscp.png \
                      usr/share/icons/hicolor/scalable/apps/linscp.svg; do
            echo "$contents" | grep -qx "$path" ||
              { echo "::error::$path is missing from the package"; exit 1; }
          done
          # upload-artifact forbids '..' paths, so stage the .deb in the workspace.
          cp ../linscp_*_*.deb "$GITHUB_WORKSPACE/"

      - name: Install and smoke test the package
        run: |
          sudo dpkg -i ../linscp_*_*.deb
          test -x /usr/bin/linscp-gui
          test -x /usr/bin/linscp-web

      # The browser host is the same page without a native window: start it on
      # a loopback port, read the token it prints, and ask it for the page and
      # for one API answer. A host that serves the page but not the API would
      # otherwise only be noticed by a user.
      - name: Smoke test the browser host
        run: |
          set -euo pipefail
          log=$(mktemp)
          linscp-web --port=8791 --print-token >"$log" 2>&1 &
          app=$!
          trap 'kill "$app" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            grep -q '^Token: ' "$log" && break
            kill -0 "$app" 2>/dev/null || { cat "$log"; echo "::error::linscp-web exited before printing its token"; exit 1; }
            sleep 1
          done
          token=$(sed -n 's/^Token: //p' "$log" | head -n 1)
          test -n "$token" || { cat "$log"; echo "::error::linscp-web printed no token"; exit 1; }
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "http://127.0.0.1:8791/" && break
            sleep 1
          done
          # The page is read whole before it is searched: `curl | grep -q` lets
          # grep close the pipe early, which turns curl into a SIGPIPE failure
          # under `pipefail` and makes a page that does carry the token look
          # like one that does not.
          page=$(curl -fsS "http://127.0.0.1:8791/")
          case "$page" in
            *LSCP_TOKEN*) ;;
            *) echo "::error::the served page carries no token"; exit 1 ;;
          esac
          # A request without the bearer token is refused, and one with it is
          # answered: the token is the whole access control of this mode.
          status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8791/api/status")
          test "$status" = 401 || { echo "::error::/api/status answered $status without a token"; exit 1; }
          status_answer=$(curl -fsS -H "X-LSCP-Token: $token" "http://127.0.0.1:8791/api/status")
          case "$status_answer" in
            *'"tabs"'*) ;;
            *) echo "::error::/api/status did not answer the session list"; exit 1 ;;
          esac
          # A Host header that is not allowed must not be treated as loopback.
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' "http://127.0.0.1:8791/api/status")
          test "$status" = 403 || { echo "::error::a foreign Host header answered $status"; exit 1; }
          echo "linscp-web served the page and answered the API"

      - name: Smoke test the native window
        run: |
          if xvfb-run -a bash -euo pipefail -c '
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            openbox >/dev/null 2>&1 &
            wm=$!
            linscp-gui &
            app=$!
            trap "kill $app $wm 2>/dev/null || true" EXIT
            for i in $(seq 1 120); do
              if ! kill -0 "$app" 2>/dev/null; then
                wait "$app" || true
                echo "Application exited before opening a window" >&2
                exit 1
              fi
              if xdotool search --onlyvisible --name "^LinSCP" >/dev/null 2>&1; then
                echo "LinSCP window opened"
                exit 0
              fi
              sleep 1
            done
            echo "The LinSCP window did not open within 120 seconds" >&2
            xdotool search --name ".*" getwindowname %@ || true
            for id in $(xdotool search --name "LinSCP" || true); do xwininfo -id "$id" || true; done
            ps -ef | grep -E "[l]inscp-gui|[W]ebKit|[b]wrap" || true
            exit 1
          ' > native-smoke.log 2>&1; then
            cat native-smoke.log
          else
            cat native-smoke.log
            python3 -c 'from pathlib import Path; t=Path("native-smoke.log").read_text().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Native window smoke test::" + t[-3000:])'
            exit 1
          fi

      # A3: the shipped binary ignored its own command line, so the documented
      # "--install-shell-integration" never ran and the actions it writes could not
      # exist. This drives the installed binary the way a file manager does: install
      # into a scratch data directory, check the definitions are there and carry the
      # flag, stage a selection through the very same flag the definition contains,
      # and uninstall. It fails if any of those steps stops doing something.
      - name: Smoke test the file-manager actions
        run: |
          set -euo pipefail
          # Separate config root for the manifest, so it cannot disturb (or be
          # disturbed by) the window smoke test that runs after this.
          export LINSCP_CONFIG_DIR=$(mktemp -d)
          export XDG_DATA_HOME=$(mktemp -d)
          linscp-gui --install-shell-integration
          for path in "kio/servicemenus/linscp-upload.desktop" \
                      "nautilus/scripts/Upload with LinSCP" \
                      "nemo/actions/linscp-upload.nemo_action"; do
            test -f "$XDG_DATA_HOME/$path" || { echo "::error::$path was not written"; exit 1; }
          done
          grep -q -- '--shell-upload' "$XDG_DATA_HOME/kio/servicemenus/linscp-upload.desktop" ||
            { echo "::error::the Dolphin action does not call --shell-upload"; exit 1; }
          # The action itself, with the selection a file manager would pass. The
          # manifest lands in the config directory the running window polls, and the
          # command returns instead of opening a window (a file manager would wait).
          selection=$(mktemp)
          timeout 60 linscp-gui --shell-upload "$selection"
          manifests=$(find "$LINSCP_CONFIG_DIR" -path '*shell-manifests/*.json' -print -quit)
          test -n "$manifests" || { echo "::error::--shell-upload recorded no manifest"; exit 1; }
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['items'], d" "$manifests"

          # GNOME Files never passes the selection as arguments: the script reads it
          # from the environment, one path per line. Run the installed script that way
          # with two awkward names and check both survive verbatim.
          first="$PWD/first file&odd.txt"
          second="$PWD/second*.glob"
          : > "$first"
          : > "$second"
          rm -rf "$LINSCP_CONFIG_DIR"/shell-manifests
          selected=$(printf '%s\n%s' "$first" "$second")
          NAUTILUS_SCRIPT_SELECTED_FILE_PATHS="$selected" \
            timeout 60 "$XDG_DATA_HOME/nautilus/scripts/Upload with LinSCP"
          staged=$(find "$LINSCP_CONFIG_DIR" -path '*shell-manifests/*.json' -print -quit)
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); paths=sorted(i['path'] for i in d['items']); assert len(paths)==2, paths; assert paths[0].endswith('first file&odd.txt'), paths; assert paths[1].endswith('second*.glob'), paths" "$staged"
          linscp-gui --uninstall-shell-integration
          test ! -f "$XDG_DATA_HOME/kio/servicemenus/linscp-upload.desktop" ||
            { echo "::error::uninstall left the Dolphin action behind"; exit 1; }
          # The help text is reachable without a display, so a user can discover the
          # flags from a terminal and not only from the documentation.
          usage=$(linscp-gui --help)
          case "$usage" in
            *--shell-upload*) ;;
            *) echo "::error::--help did not document --shell-upload"; exit 1 ;;
          esac

      - name: Upload the Debian package
        uses: actions/upload-artifact@v7
        with:
          name: linscp-debian
          path: linscp_*_*.deb
