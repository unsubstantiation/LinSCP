name: Debian build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Linux checks & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-tests

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            python3-paramiko python3-pyftpdlib python3-openssl

      - name: Check GUI distribution, workflow triggers, and X2Go
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p test_gui_distribution.py
          python3 -m unittest discover -s tools/tests -p test_workflow_triggers.py
          python3 -m unittest discover -s tools/tests -p test_x2go_installer.py

      - name: Install and test the shared frontend
        run: |
          set -euo pipefail
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui test
          python3 tools/compile_translations.py --check && python3 tools/check_shared_frontend.py

      - name: Check the parity ledger and its repo-state suites
        run: |
          set -euo pipefail
          python3 tools/check_upstream_parity.py
          python3 -m unittest discover -s tools/tests -p test_build_version.py
          python3 -m unittest discover -s tools/tests -p test_parity_inventory.py
          python3 -m unittest discover -s tools/tests -p test_platform_conversion.py
          python3 -m unittest discover -s tools/tests -p test_wayland_compatibility.py
          python3 -m unittest discover -s tools/tests -p test_translations.py
          python3 -m unittest discover -s tools/tests -p test_unified_locales.py
          python3 -m unittest discover -s tools/tests -p test_shared_frontend.py
          python3 tools/check_ci_test_execution.py
          python3 -m unittest discover -s tools/tests -p test_rust_cross_lang_parity.py
          python3 -m unittest discover -s tools/tests -p test_repo_hygiene.py
          python3 -m unittest discover -s tools/tests -p test_ci_test_execution.py

      - name: Exercise offline workspace unit tests
        run: |
          set -euo pipefail
          python3 tools/run_cargo_ci.py cargo test -p linscp-platform -p linscp-types -p linscp-i18n -p linscp-crypto -p linscp-proto -p linscp-engine -p linscp-terminal -p linscp-tauri -- --nocapture
          python3 tools/run_cargo_ci.py cargo test -p linscp-service -- --nocapture --test-threads=1 --skip live_

      - name: Exercise live protocol integration tests
        env:
          LSCP_LIVE_SFTP: "1"
          LSCP_LIVE_WEBDAV: "1"
          LSCP_LIVE_FTP: "1"
          LSCP_LIVE_FTPES: "1"
          LSCP_LIVE_FTPS_IMPLICIT: "1"
          LSCP_LIVE_S3: "1"
          RUST_MIN_STACK: "16777216"
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service live_ -- --nocapture --test-threads=1
  build:
    name: Debian package (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-deb-release

      - name: Install packaging and smoke-test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq --no-install-recommends \
            build-essential dpkg-dev debhelper pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool xauth openbox x11-utils

      - name: Build the frontend bundle
        run: |
          set -euo pipefail
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build

      - name: Build the binary package
        env:
          DEB_BUILD_OPTIONS: "nocheck"
        run: python3 tools/run_cargo_ci.py dpkg-buildpackage -b -us -uc -d

      - name: Check the package contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(../linscp_*_*.deb)
          test "${#debs[@]}" -eq 1 || { echo "::error::Expected exactly one .deb, found ${#debs[@]}"; exit 1; }
          deb="${debs[0]}"
          echo "Built $deb"
          dpkg-deb --contents "$deb"
          contents=$(dpkg-deb --contents "$deb" | awk '{print $NF}' | sed 's|^\./||' | sort)
          for path in usr/bin/linscp-gui \
                      usr/share/applications/linscp.desktop \
                      usr/share/pixmaps/linscp.png \
                      usr/share/icons/hicolor/scalable/apps/linscp.svg; do
            echo "$contents" | grep -qx "$path" ||
              { echo "::error::$path is missing from the package"; exit 1; }
          done
          cp "$deb" "$GITHUB_WORKSPACE/"

      - name: Install and smoke test the package
        run: |
          set -euo pipefail
          sudo dpkg -i ../linscp_*_*.deb
          test -x /usr/bin/linscp-gui

      - name: Smoke test the native window
        run: |
          set -euo pipefail
          if xvfb-run -a bash -euo pipefail -c '
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            openbox >/dev/null 2>&1 &
            wm=$!
            linscp-gui &
            app=$!
            trap "kill $app $wm 2>/dev/null || true" EXIT
            for i in $(seq 1 120); do
              if ! kill -0 "$app" 2>/dev/null; then
                wait "$app" || true
                echo "Application exited before opening a window" >&2
                exit 1
              fi
              if xdotool search --onlyvisible --name "^LinSCP" >/dev/null 2>&1; then
                echo "LinSCP window opened"
                exit 0
              fi
              sleep 1
            done
            echo "The LinSCP window did not open within 120 seconds" >&2
            exit 1
          ' > native-smoke.log 2>&1; then
            cat native-smoke.log
          else
            cat native-smoke.log
            exit 1
          fi

      - name: Smoke test the file-manager actions
        run: |
          set -euo pipefail
          export LINSCP_CONFIG_DIR=$(mktemp -d)
          export XDG_DATA_HOME=$(mktemp -d)
          trap 'rm -rf "$LINSCP_CONFIG_DIR" "$XDG_DATA_HOME"' EXIT

          linscp-gui --install-shell-integration
          for path in "kio/servicemenus/linscp-upload.desktop" \
                      "nautilus/scripts/Upload with LinSCP" \
                      "nemo/actions/linscp-upload.nemo_action"; do
            test -f "$XDG_DATA_HOME/$path" || { echo "::error::$path was not written"; exit 1; }
          done

          selection=$(mktemp)
          timeout 60 linscp-gui --shell-upload "$selection"
          manifests=$(find "$LINSCP_CONFIG_DIR" -path '*shell-manifests/*.json' -print -quit)
          test -n "$manifests" || { echo "::error::--shell-upload recorded no manifest"; exit 1; }

          linscp-gui --uninstall-shell-integration
          test ! -f "$XDG_DATA_HOME/kio/servicemenus/linscp-upload.desktop" ||
            { echo "::error::uninstall left the Dolphin action behind"; exit 1; }

      - name: Upload the Debian package
        uses: actions/upload-artifact@v7
        with:
          name: linscp-debian
          path: linscp_*_*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
