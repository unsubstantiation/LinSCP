name: Arena Make installation validation
on:
  push:
    branches: [arena/c4f5bb7a-linscp]
permissions:
  contents: read
jobs:
  make-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-deb-release
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool xauth openbox
      - name: Build and stage custom-prefix Make install
        run: |
          set -euo pipefail
          make -C source/linux install PREFIX=/opt/linscp DESTDIR="$RUNNER_TEMP/stage"
          test -x "$RUNNER_TEMP/stage/opt/linscp/bin/linscp-gui"
          test -f "$RUNNER_TEMP/stage/opt/linscp/share/applications/linscp.desktop"
      - name: Launch staged GUI under Xvfb
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/stage/opt/linscp/bin:$PATH"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a bash -euo pipefail -c '
            openbox >/dev/null 2>&1 & wm=$!
            linscp-gui >/tmp/linscp-make-smoke.log 2>&1 & app=$!
            trap "kill $app $wm 2>/dev/null || true" EXIT
            for i in $(seq 1 120); do
              if ! kill -0 "$app" 2>/dev/null; then cat /tmp/linscp-make-smoke.log; exit 1; fi
              if xdotool search --onlyvisible --name "^LinSCP" >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            cat /tmp/linscp-make-smoke.log
            exit 1
          '
