name: Chunk 2 transfer checks
on:
  push:
    branches: [arena/4b00efe6-linscp]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Transfer regression tests
        run: cargo test -p linscp-engine --test ordinary_conditional_resume --test ftp_staged_ascii --test sftp_live_cases
