name: Chunk 4 backup validation
on:
  push:
    branches: [arena/4b00efe6-linscp]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libssh2-1-dev
      - name: Engine backup tests
        run: 'python3 tools/run_cargo_ci.py cargo test -p linscp-engine backup:: -- --nocapture'
      - name: Service backup tests
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service key_session -- --nocapture
      - name: Service offlineotp tests
        run: python3 tools/run_cargo_ci.py cargo test -p linscp-service offlineotp -- --nocapture
