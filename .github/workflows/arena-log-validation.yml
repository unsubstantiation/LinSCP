name: Diagnostic redaction validation
on:
  push:
    branches: [arena/cf506e43-linscp]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - name: Test redaction and XML logging
        shell: bash
        env:
          RUST_MIN_STACK: '16777216'
        run: |
          for test in redacts_secret_switches_in_diagnostics_without_destroying_prose text_and_xml_failures_redact_recognized_secret_switches redacts_each_url_in_diagnostics_independently text_and_xml_logs_redact_multiple_urls_in_failures parameter_expansion_and_log_censoring_match_script_rules; do
            cargo test -p linscp-engine --lib "$test" > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
          done
          cargo test -p linscp-engine --test script_engine_cases test_xml_ > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
