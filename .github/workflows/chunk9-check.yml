name: Chunk 9 XML checks
on:
  push:
    branches: [arena/4b00efe6-linscp]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p linscp-engine xml_log
      - run: cargo test -p linscp-service xml
      - name: Validate GUI service XML against the pinned schema
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user 'xmlschema>=3,<5'
          export LINSCP_XML_SERVICE_OUTPUT="$RUNNER_TEMP/gui-actions.xml"
          cargo test -p linscp-service queue_and_gui_xml_records_share_a_lock_and_preserve_existing_log
          python3 -m unittest discover -s tools/tests -p test_xml_schema.py
      - name: Validate live WebDAV GUI XML
        if: runner.os == 'Linux'
        run: |
          export LSCP_LIVE_WEBDAV=1 RUST_MIN_STACK=16777216
          export LINSCP_XML_LIVE_OUTPUT="$RUNNER_TEMP/live-actions.xml"
          cargo test -p linscp-service live_webdav_gui_upload_download -- --nocapture --test-threads=1
          python3 -m unittest discover -s tools/tests -p test_xml_schema.py
