name: Temporary FTP resume validation
on:
  push:
    branches: [arena/cf506e43-linscp]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: resume-validation
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libkrb5-dev libssl-dev
      - name: Run FTP and SFTP integration tests
        shell: bash
        run: |
          set +e
          export CARGO_TERM_COLOR=never
          cargo test -p linscp-engine --test ftp_staged_ascii -- --nocapture > test-output.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            cargo test -p linscp-engine --test sftp_live_cases -- --nocapture >> test-output.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo test -p linscp-proto --test ftp_and_ftps -- --nocapture >> test-output.txt 2>&1
            status=$?
          fi
          tail -50 test-output.txt
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path('test-output.txt').read_text(errors='replace').splitlines()[-50:])[-3500:]
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$status"
