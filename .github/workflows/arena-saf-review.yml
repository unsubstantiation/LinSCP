name: Temporary SAF service review
on:
  push:
    branches: [arena/8a2ae295-linscp]
permissions:
  contents: read
jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: transfer-move-review
      - name: Test SAF transfer and risk regressions
        shell: bash
        run: |
          set +e
          cargo test -p linscp-service saf_ -- --nocapture --test-threads=1 > saf-test.log 2>&1
          status=$?
          tail -100 saf-test.log
          if [ "$status" != 0 ]; then
            python -c 'import pathlib; s=pathlib.Path("saf-test.log").read_text(errors="replace"); s=s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error::" + s[-12000:])'
          fi
          exit "$status"
