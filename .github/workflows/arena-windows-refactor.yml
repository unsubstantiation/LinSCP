name: Windows refactor validation
on:
  push:
    branches: [arena/47659bfb-linscp]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-tests
      - name: Run engine and service tests
        shell: pwsh
        run: |
          cargo test -p linscp-engine -p linscp-service -- --test-threads=1 --skip live_ 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\refactor-tests.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP\refactor-tests.log" -Tail 80 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
