name: Temporary Windows diagnostics
on:
  push:
    branches: [arena/58f8734a-linscp]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: transfer-move-review
      - name: Reproduce concurrent shell manifest claims
        shell: bash
        run: |
          set +e
          for n in $(seq 1 40); do
            cargo test -p linscp-service --lib shell_manifest_has_at_most_one_successful_consumer -- --nocapture >> manifest-test.log 2>&1 || break
          done
          python -c 'import pathlib; s=pathlib.Path("manifest-test.log").read_text(errors="replace"); s=s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::notice::" + s[-10000:])'
      - name: Test full service suite
        shell: bash
        run: python tools/run_cargo_ci.py cargo test -p linscp-service --lib
