name: Saved site vault validation
on:
  push:
    branches: [arena/cf506e43-linscp]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - name: Test vault and session storage
        shell: bash
        env:
          RUST_MIN_STACK: '16777216'
        run: |
          for test in saved_site_vault_reopens_and_rejects_wrong_password_and_tampering sessions_save_round_trip_stores_and_reports_the_key_password vault_migrates_and_encrypts_full_session_and_reconnect_state; do
            cargo test -p linscp-service "$test" > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
          done
