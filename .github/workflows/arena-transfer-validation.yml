name: Temporary transfer validation
on:
  push:
    branches: [arena/7d43ba52-linscp]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-tests
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libkrb5-dev libssl-dev
      - name: Run exclusive ASCII upload integration test
        run: cargo test -p linscp-engine --test sftp_live_cases test_exclusive_ascii_and_automatic_uploads -- --nocapture
