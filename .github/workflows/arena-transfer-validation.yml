name: Temporary transfer validation
on:
  push:
    branches: [arena/7d43ba52-linscp]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-tests
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libkrb5-dev libssl-dev
      - name: Run ASCII upload integration tests
        shell: bash
        run: |
          set +e
          export CARGO_TERM_COLOR=never
          cargo test -p linscp-engine --test sftp_live_cases -- --nocapture > test-output.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            cargo test -p linscp-engine --test conditional_ascii_upload -- --nocapture >> test-output.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo test -p linscp-proto --test ssh_sftp_scp_tunnel -- --nocapture >> test-output.txt 2>&1
            status=$?
          fi
          tail -100 test-output.txt
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('test-output.txt').read_text(errors='replace').splitlines()
          text = '\n'.join(lines[-50:])[-3500:]
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$status"
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-tests
      - name: Test ASCII upload cases
        shell: bash
        run: |
          set +e
          export CARGO_TERM_COLOR=never
          cargo test -p linscp-engine --test sftp_live_cases test_exclusive_ascii_and_automatic_uploads -- --nocapture > test-output.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            cargo test -p linscp-engine --test conditional_ascii_upload -- --nocapture >> test-output.txt 2>&1
            status=$?
          fi
          tail -60 test-output.txt
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path('test-output.txt').read_text(errors='replace').splitlines()[-40:])[-3500:]
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$status"
