name: Resume modes validation
on:
  push:
    branches: [arena/cf506e43-linscp]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - name: Test resume options and staged download
        shell: bash
        env:
          RUST_MIN_STACK: '16777216'
        run: |
          cargo test -p linscp-engine --test sftp_live_cases sftp_resume_support_off_and_size_threshold_control_staging > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
          cargo test -p linscp-engine --test script_engine_cases test_option_resume_values > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
          cargo test -p linscp-engine --test sftp_live_cases test_a_staged_download_publishes_only_the_whole_file > test.log 2>&1 || { tail -100 test.log; echo "::error::$(tail -60 test.log | tr '\n' ' ')"; exit 1; }
