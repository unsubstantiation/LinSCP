name: Cross-Platform Rust & UI

on:
  push:
  pull_request:

jobs:
  hygiene-and-ui:
    name: Repo Hygiene, Unified Locales & TypeScript UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify cross-platform hygiene and unified locales
        run: |
          python3 tools/check_repo_hygiene.py
          python3 tools/tests/test_repo_hygiene.py
          python3 tools/build_unified_locales.py --check
          python3 tools/tests/test_unified_locales.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typecheck, bundle, and test dual-mode UI
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          npm test

  rust-linux:
    name: Rust Workspace & Tauri Host (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Run pure-Rust workspace unit tests
        run: cargo test --workspace --message-format=github

      - name: Lint workspace with Clippy
        run: cargo clippy --workspace --all-targets --message-format=github -- -D warnings

      - name: Install Linux Tauri WebKit2GTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check Tauri v2 native shell crate on Linux
        run: cargo check -p linscp-tauri --features native-shell --message-format=github

  rust-windows:
    name: Rust Workspace & Tauri Host (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run pure-Rust workspace unit tests on Windows
        run: cargo test --workspace --message-format=github

      - name: Lint workspace with Clippy on Windows
        run: cargo clippy --workspace --all-targets --message-format=github -- -D warnings

      - name: Check Tauri v2 native shell crate on Windows
        run: cargo check -p linscp-tauri --features native-shell --message-format=github

  rust-android:
    name: Rust Core & Android SAF Platform Target (Android NDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Check workspace for Android arm64-v8a and x86_64
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ] && [ -d /usr/local/lib/android/sdk/ndk ]; then
            export ANDROID_NDK_HOME="$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)"
          fi
          cargo ndk -t arm64-v8a -t x86_64 check --message-format=github \
            -p linscp-types \
            -p linscp-i18n \
            -p linscp-crypto \
            -p linscp-platform \
            -p linscp-proto \
            -p linscp-engine \
            -p linscp-service \
            -p linscp-http \
            -p linscp-cli
