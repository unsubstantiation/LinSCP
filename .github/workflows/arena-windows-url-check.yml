name: Arena Windows URL validation
on:
  push:
    branches: [arena/c4f5bb7a-linscp]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build UI
        run: npm ci --prefix ui && npm run build --prefix ui
      - name: Platform tests
        run: python tools/run_cargo_ci.py cargo test -p linscp-platform
      - name: Build native shell
        run: python tools/run_cargo_ci.py cargo build -p linscp-tauri --features native-shell
      - name: Exercise built URL registration commands
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'target/debug/linscp-gui.exe').Path
          try {
            $p = Start-Process -FilePath $exe -ArgumentList '--install-url-handlers' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "URL registration failed: $($p.ExitCode)" }
            & reg.exe query 'HKCU\Software\Classes\LinSCP.Url\shell\open\command'
            if ($LASTEXITCODE -ne 0) { throw 'URL command missing' }
            & reg.exe query 'HKCU\Software\LinSCP\UrlHandlers\Capabilities\URLAssociations' /v sftp
            if ($LASTEXITCODE -ne 0) { throw 'SFTP association missing' }
          } finally {
            $p = Start-Process -FilePath $exe -ArgumentList '--uninstall-url-handlers' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "URL unregister failed: $($p.ExitCode)" }
          }
          & reg.exe query 'HKCU\Software\Classes\LinSCP.Url' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'URL registration was not removed' }
          exit 0
