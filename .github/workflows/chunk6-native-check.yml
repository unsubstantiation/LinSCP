name: Chunk 6 native check
on:
  push:
    branches: [arena/4b00efe6-linscp]
jobs:
  drop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/run_cargo_ci.py cargo test -p linscp-service a_native_window_drop_names_paths_and_the_backend_reads_them -- --nocapture
