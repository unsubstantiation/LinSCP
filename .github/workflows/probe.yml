name: Probe

on:
  push:
    branches:
      - 'arena/c82dca30-linscp'

jobs:
  probe:
    name: Probe diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the http crate and surface the Send notes
        shell: bash
        run: |
          CARGO_TERM_COLOR=never cargo check -p linscp-http > probe.log 2>&1 || true
          python3 tools/probe_send.py probe.log
