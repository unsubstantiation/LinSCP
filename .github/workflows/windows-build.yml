name: Windows build

on:
  push:
    branches: [master]
  # A pull request has to prove itself before it merges: without this trigger
  # a PR lands with every build unrun, and master is where the red is found.
  pull_request:
  # Run by hand from the Actions tab (or `gh workflow run`) to build a branch
  # or re-run a build without waiting for a push to master.
  workflow_dispatch:

jobs:
  build:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the UI dependencies
        working-directory: ui
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Build the TypeScript UI
        working-directory: ui
        shell: bash
        run: npm run build

      - name: Test the TypeScript UI
        working-directory: ui
        shell: bash
        run: python ../tools/run_cargo_ci.py npm test

      - name: Run the Rust workspace unit tests
        shell: bash
        run: python tools/run_cargo_ci.py cargo test --workspace

      - name: Build the portable Tauri application
        shell: bash
        run: python tools/run_cargo_ci.py cargo build --release -p linscp-tauri --features native-shell

      - name: Smoke test the native window
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$PWD/target/release/linscp-gui.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "Application exited before opening a window: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0 -and $app.MainWindowTitle -like 'LinSCP*') { $ready = $true; break }
            }
            if (-not $ready) { throw 'The LinSCP window did not open within 30 seconds' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      # A3: the shipped binary ignored its own command line, so the *Send To*
      # shortcut could never be installed by any artifact Microsoft ships. Drive the
      # built binary the way Explorer does. The GUI is a windows-subsystem program, so
      # it writes nothing to this console; what is checked is the files it produces.
      # APPDATA is redirected so the runner's own Send To menu is left alone.
      - name: Smoke test the Explorer action
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "linscp-a3"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $root "appdata"), (Join-Path $root "config") | Out-Null
          $env:APPDATA = Join-Path $root "appdata"
          $env:LINSCP_CONFIG_DIR = Join-Path $root "config"
          $exe = "$PWD/target/release/linscp-gui.exe"
          $sendto = Join-Path $env:APPDATA "Microsoft\Windows\SendTo\Upload with LinSCP.cmd"

          # Wait for it: the GUI is a windows-subsystem binary, so PowerShell would
          # otherwise not block on it and every check below would race the install.
          $install = Start-Process -FilePath $exe -ArgumentList "--install-shell-integration" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "--install-shell-integration exited $($install.ExitCode)" }
          if (-not (Test-Path $sendto)) { throw "the Send To shortcut was not written" }
          if (-not (Select-String -Path $sendto -Pattern '--shell-upload' -Quiet)) {
            throw "the Send To shortcut does not call --shell-upload"
          }

          # What Explorer does with a right-click: run it with the selection.
          $selection = Join-Path $root "report.pdf"
          Set-Content -Path $selection -Value "payload"
          $process = Start-Process -FilePath $sendto -ArgumentList "`"$selection`"" -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw "the Send To action did not return" }
          if ($process.ExitCode -ne 0) { throw "the Send To action exited $($process.ExitCode)" }

          $manifest = Get-ChildItem -Path $env:LINSCP_CONFIG_DIR -Recurse -Filter "*.json" |
            Where-Object { $_.FullName -like "*shell-manifests*" } | Select-Object -First 1
          if (-not $manifest) { throw "--shell-upload recorded no manifest" }
          $staged = Get-Content -Raw $manifest.FullName | ConvertFrom-Json
          if (-not $staged.items) { throw "the manifest has no items" }
          if ($staged.items[0].path -ne $selection) { throw "the manifest names $($staged.items[0].path)" }

          $uninstall = Start-Process -FilePath $exe -ArgumentList "--uninstall-shell-integration" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "--uninstall-shell-integration exited $($uninstall.ExitCode)" }
          if (Test-Path $sendto) { throw "uninstall left the Send To shortcut behind" }

      # One application, one artifact: the native window is the product. The
      # browser server that used to be built and smoked here was a second host
      # for the same page, and this project does not ship it.
      - name: Upload the portable application
        uses: actions/upload-artifact@v7
        with:
          name: linscp-windows
          path: target/release/linscp-gui.exe
          if-no-files-found: error
