name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the UI dependencies
        working-directory: ui
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Build the TypeScript UI
        working-directory: ui
        shell: bash
        run: npm run build

      - name: Test the TypeScript UI
        working-directory: ui
        shell: bash
        run: python ../tools/run_cargo_ci.py npm test

      - name: Run the Rust workspace unit tests
        shell: bash
        run: python tools/run_cargo_ci.py cargo test --workspace

      - name: Build the portable Tauri application
        shell: bash
        run: python tools/run_cargo_ci.py cargo build --release -p linscp-tauri --features native-shell

      - name: Upload the portable application
        uses: actions/upload-artifact@v7
        with:
          name: linscp-windows
          path: target/release/linscp-gui.exe
          if-no-files-found: error
