name: Temporary transfer move review
on:
  push:
    branches: [arena/8a2ae295-linscp]
permissions:
  contents: read
jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: transfer-move-review
      - name: Test queue safety
        run: cargo test -p linscp-service transfer_safety_tests -- --nocapture
      - name: Test move upload change detection
        run: cargo test -p linscp-service move_upload_ -- --nocapture
      - name: Test skipped moves
        run: cargo test -p linscp-service skipped_moves_keep_sources -- --nocapture
