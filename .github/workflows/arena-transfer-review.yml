name: Temporary multipart review
on:
  push:
    branches: [arena/8a2ae295-linscp]
permissions:
  contents: read
jobs:
  s3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: transfer-move-review
      - name: Test multipart checkpoint regressions
        run: cargo test -p linscp-proto --test webdav_and_s3 s3_ -- --nocapture
