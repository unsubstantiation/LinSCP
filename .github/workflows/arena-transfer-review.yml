name: Temporary transfer safety review
on:
  push:
    branches: [arena/8a2ae295-linscp]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-tests
      - name: Test service safety regressions
        run: cargo test -p linscp-service transfer_safety_tests -- --nocapture
