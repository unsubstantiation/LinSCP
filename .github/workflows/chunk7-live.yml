name: Chunk 7 live and host checks
on:
  push:
    branches: [arena/4b00efe6-linscp]
jobs:
  hosts:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/run_cargo_ci.py cargo test -p linscp-engine changes_during_initial_sync_trigger_an_immediate_second_pass -- --nocapture
      - run: python3 tools/run_cargo_ci.py cargo test -p linscp-engine sync_planner::tests -- --nocapture
      - run: python3 tools/run_cargo_ci.py cargo test -p linscp-platform recommendations_mention_all_protocols -- --nocapture
      - run: python3 tools/run_cargo_ci.py cargo test -p linscp-service search_and_sync_refuse_unsafe_server_entries_and_bound_remote_reads -- --nocapture
  live:
    runs-on: ubuntu-24.04
    env:
      LSCP_LIVE_WEBDAV: '1'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/run_cargo_ci.py cargo test -p linscp-service live_webdav_sync_encoding_and_interrupted_delete -- --nocapture
